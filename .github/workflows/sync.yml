name: Sync Forex Factory Calendar Feed

on:
  schedule:
    - cron: '0 21 * * 0'
    - cron: '0 */4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Forex Factory Calendar
        run: |
          python -c "
          import urllib.request
          import json
          from datetime import datetime

          FEED_URL = 'https://nfs.faireconomy.media/ff_calendar_thisweek.json'
          CACHE_FILE = 'news_calendar_ff_cache.json'

          try:
              req = urllib.request.Request(FEED_URL, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
                  if isinstance(data, list) and len(data) > 0:
                      now_iso = datetime.now().isoformat()
                      with open(CACHE_FILE, 'w', encoding='utf-8') as f:
                          json.dump({'last_updated': now_iso, 'events': data}, f, indent=2, ensure_ascii=False)
                      print(f'Successfully updated cache with {len(data)} events at {now_iso}')
          except Exception as e:
              print('Error fetching Forex Factory:', e)
              exit(1)
          "

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action News Sync"
          git add news_calendar_ff_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync Forex Factory economic calendar [skip ci]" && git push)
